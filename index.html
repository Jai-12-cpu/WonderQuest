<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WonderQuest — a text adventure</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0b1220;
    color: #d7e2f0;
    font-family: 'Courier New', Courier, monospace;
    min-height: 100%;
  }
  #wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 40px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding-bottom: 16px;
    border-bottom: 1px solid #24344f;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    color: #7fe3b4;
    letter-spacing: 1px;
  }
  header p { margin: 0; font-size: 13px; color: #7f93b3; }
  header a { color: #7fe3b4; }
  #terminal {
    flex: 1;
    background: #060b14;
    border: 1px solid #24344f;
    border-radius: 6px;
    padding: 16px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 14px;
    line-height: 1.5;
    min-height: 420px;
    max-height: 60vh;
  }
  #inputRow {
    display: flex;
    align-items: center;
    margin-top: 10px;
    background: #060b14;
    border: 1px solid #24344f;
    border-radius: 6px;
    padding: 8px 12px;
  }
  #prompt { color: #7fe3b4; margin-right: 8px; user-select: none; }
  #cmdInput {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #d7e2f0;
    font-family: inherit;
    font-size: 14px;
  }
  #cmdInput:disabled { opacity: 0.4; }
  #controls { margin-top: 14px; text-align: center; }
  #startBtn {
    background: #16a97c;
    color: #04150f;
    border: none;
    padding: 12px 28px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    border-radius: 6px;
    cursor: pointer;
  }
  #startBtn:hover { background: #1ec996; }
  #startBtn:disabled { opacity: 0.5; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; color: #556a8c; text-align: center; }
  .loading-dot { animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>WonderQuest</h1>
    <p>A C++ text adventure through Wonderland, compiled to WebAssembly and running live in this page. Source on <a href="https://github.com/jai-12-cpu/wonderquest" target="_blank" rel="noopener">GitHub</a>.</p>
  </header>

  <div id="terminal">Click "Start Game" below to begin. Wonderland is loading<span class="loading-dot">...</span></div>

  <div id="inputRow" style="display:none;">
    <span id="prompt">&gt;</span>
    <input id="cmdInput" type="text" autocomplete="off" disabled placeholder="Loading...">
  </div>

  <div id="controls">
    <button id="startBtn" disabled>Loading...</button>
  </div>
  <div id="status">Type commands like "look", "go n", "pick key", "talk white rabbit", "inventory", "quit".</div>
</div>

<script>
  var terminalEl = document.getElementById('terminal');
  var startBtn = document.getElementById('startBtn');
  var statusEl = document.getElementById('status');
  var inputRow = document.getElementById('inputRow');
  var inputEl = document.getElementById('cmdInput');
  var firstOutput = true;
  var ready = false;

  function printLine(text) {
    if (firstOutput) {
      terminalEl.textContent = '';
      firstOutput = false;
    }
    terminalEl.textContent += text + '\n';
    terminalEl.scrollTop = terminalEl.scrollHeight;
  }

  var pendingResolve = null;
  function waitForLine() {
    return new Promise(function(resolve) {
      pendingResolve = resolve;
      inputEl.disabled = false;
      inputEl.placeholder = 'Type your command...';
      inputEl.focus();
    });
  }
  inputEl.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && pendingResolve) {
      var val = inputEl.value;
      inputEl.value = '';
      inputEl.disabled = true;
      inputEl.placeholder = 'Thinking...';
      printLine('> ' + val);
      var resolve = pendingResolve;
      pendingResolve = null;
      resolve(val);
    }
  });

  var charQueue = [];

  var Module = {
    print: function(text) { printLine(text); },
    printErr: function(text) { console.error(text); },
    stdin: function() {
      if (charQueue.length > 0) {
        return charQueue.shift();
      }
      return Asyncify.handleSleep(function(wakeUp) {
        waitForLine().then(function(line) {
          var chars = line.split('').map(function(c) { return c.charCodeAt(0); });
          chars.push(10);
          charQueue = chars;
          wakeUp(charQueue.shift());
        });
      });
    },
    onRuntimeInitialized: function() {
      ready = true;
      startBtn.disabled = false;
      startBtn.textContent = 'Start Game';
      statusEl.textContent = 'Ready. Click Start Game to begin.';
    }
  };

  startBtn.addEventListener('click', function() {
    if (!ready) return;
    startBtn.disabled = true;
    startBtn.textContent = 'Game running...';
    inputRow.style.display = 'flex';
    Module.ccall('main', 'number', [], [], { async: true });
  });
</script>
<script src="game.js"></script>
</body>
</html>
